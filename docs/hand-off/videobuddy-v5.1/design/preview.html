function styles(all=false){state.search='';state.category='全部';if(!all){openDialog('试试另一种感觉',`<p style="margin-bottom:18px">先看这几个方向，不用了解专业术语。<\/p><div class="style-recs">${['swiss-motion','watercolor','paper-popup'].map(id=>styleCard(CATALOG.find(s=>s.id===id))).join('')}<\/div><p class="hint">缩略图为概念占位，正式产品使用真实样片。<\/p>`,button('看全部43种画风 '+icon('arrow'),'all-styles'));return}
 openDialog('全部画风',`<div class="gallery-tools"><input type="search" id="style-search" placeholder="搜索水墨、像素、纸片…" aria-label="搜索画风"/><select id="style-category" aria-label="筛选画风分类">${['全部',...new Set(CATALOG.map(s=>s.categoryZh))].map(c=>`<option>${esc(c)}<\/option>`).join('')}<\/select><\/div><p class="gallery-caption"><span id="style-count">43<\/span>种 · 设计占位图，不是已验证的真实样片<\/p><div class="gallery-list" id="style-list">${CATALOG.map(styleCard).join('')}<\/div>`,'',true);
 byId('style-search').addEventListener('input',e=>{state.search=e.target.value;filterStyles()});byId('style-category').addEventListener('change',e=>{state.category=e.target.value;filterStyles()});
}
function filterStyles(){const list=CATALOG.filter(s=>(state.category==='全部'||s.categoryZh===state.category)&&`${s.nameZh} ${s.nameEn} ${s.id}`.toLowerCase().includes(state.search.toLowerCase()));byId('style-count').textContent=list.length;byId('style-list').innerHTML=list.length?list.map(styleCard).join(''):'<div class="empty-gallery">没有找到，换个词试试。'+button('清除搜索','clear-search')+'<\/div>'}
function materialDialog(){openDialog('你添加的资料',state.files.length?state.files.map((f,i)=>`<div class="asset-row">${icon('file')}<div><p>${esc(f.name)}<\/p><small>原型仅演示添加，未上传或读取内容<\/small><\/div>${button('移除','remove-file','text-button',`data-index="${i}"`)}<\/div>`).join(''):'<p>暂时没有资料。你可以先聊想法，再慢慢补充。<\/p>',button('添加资料','attach','secondary-button'))}
function scriptDialog(){openDialog('完整文案',`<p>${state.name?'这是'+esc(state.name)+'。':''}清晨，先给自己一点慢下来的时间。热水、咖啡，和一段不着急的片刻。新店开业，欢迎来坐坐。<\/p><p class="hint">这是演示文案；正式版读取当前已确认的内容。这里不要求逐镜头审核。<\/p>`,button('知道了','close','main-button'))}
function doAction(a,e){if(a==='play'){const v=byId('film');v.parentElement.classList.add('is-playing');v.play().catch(()=>{v.parentElement.classList.remove('is-playing');toast('当前环境未能播放素材，画面预览仍可查看。')});return}if(a==='mobile-chat'||a==='mobile-work'){keepDraft();state.mobile=a==='mobile-chat'?'chat':'work';updateMobile();return}
 if(a==='stop-reply'){stopTurn();return}if(a==='attach'){byId('file-picker').click();return}if(a==='close'){closeDialog();return}if(a==='prepare'){prepare();return}if(a==='produce'){produce();return}if(a==='cancel'){stopProduction();return}
 if(a==='preferences'){prefs();return}if(a==='apply-prefs'&&['making','updating'].includes(state.phase)){closeDialog();toast('这次制作中的设置不变。完成后再调整，原片会保留。');return}if(a==='apply-prefs'){Object.assign(state,state.settings);closeDialog();state.previewChanged=true;if(['start','collect'].includes(state.phase))renderWork();else {state.readiness=true;prepare()}toast('偏好已应用到原型；固定示例媒体不会随之改变。');return}
 if(a==='styles'||a==='all-styles'){styles(a==='all-styles');return}if(a==='clear-search'){state.search='';byId('style-search').value='';filterStyles();return}
 if(a==='script'){scriptDialog();return}if(a==='materials'){materialDialog();return}
 if(a==='remove-file'){const removed=state.files[Number(e.dataset.index)];if(['making','updating'].includes(state.phase)){return toast('正在制作的这一版仍使用已有资料。完成后移除会用于下一版。')}state.files.splice(Number(e.dataset.index),1);if(state.phase==='preview'){state.previewChanged=true;phase('collect')}renderComposerExtras();materialDialog();toast('已移除 '+removed.name+'，新的预览会按剩余资料准备。');return}
 if(a==='no-material'){submit('暂时没有资料，先用图形和插画吧。');return}if(a==='decide'){submit('其他你来定，先给我看看效果。');return}if(a==='general'){submit('给普通观众看，尽量简单易懂。');return}
 if(a==='scroll-chat'){byId('chat-body').scrollTop=byId('chat-body').scrollHeight;byId('new-message-zone').innerHTML='';return}
 if(a==='clear-context'){state.context=null;renderComposerExtras();return}
 if(a==='feedback'){const v=byId('film');const n=Math.floor(v?.currentTime||0);state.context='00:'+String(n).padStart(2,'0');renderComposerExtras();state.mobile='chat';updateMobile();byId('chat-input').focus();return}
 if(a==='undo'){state.modified=false;phase('ready');add('assistant','已恢复原片，不用重新制作。');return}
 if(a==='remove-queue'){state.queued.splice(Number(e.dataset.index),1);renderComposerExtras();return}
 if(a==='confirm-major'){const t=state.pendingMajor;if(state.pendingStyle)state.styleId=state.pendingStyle;state.pendingStyle=null;state.pendingMajor=null;state.readiness=true;add('user','先看新效果');if(['making','updating'].includes(state.phase)){state.pendingEdit=t;state.pendingKind='major';add('assistant','已经记下换画风的请求。这次制作结束后，先做新预览，不会直接交付未确认的新片。');renderChat();return}state.previewChanged=true;prepare();return}
 if(a==='dismiss-major'){state.pendingMajor=null;state.pendingStyle=null;renderChat();return}
 if(a==='home'||a==='new'){if(['making','preparing','updating'].includes(state.phase))return openDialog('离开当前创作？','<p>正式产品会在后台继续制作，之后可从“我的视频”回来。本样稿仅展示单个演示项目。<\/p>',button('留在这里','close','main-button'));setDraft('');state.messages=[];state.name='';state.goal='';state.idea='';state.files=[];state.readiness=false;state.modified=false;state.pendingMajor=null;state.phase='start';shell();return}
 if(a==='projects'){openDialog('我的视频',`<button class="project-row" data-action="open-project"><img src="${POSTER}" alt="演示视频封面"/><span><strong>清晨的第一杯<\/strong><small>交互示例 · 8秒素材<\/small><\/span>${icon('chev')}<\/button><p class="hint">正式版沿用原有云端保存和访问机制，不新增登录。<\/p>`);return}
 if(a==='open-project'){closeDialog();loadFixture('ready');return}
 if(a==='more'||a==='assistant-more'){openDialog('更多',`<div class="menu-list">${button('换个画风','styles')}${button('调整时长、画幅和声音','preferences')}${['preview','making','ready','updating','error','cancelled'].includes(state.phase)?button('看看完整文案','script'):''}${button('查看添加的资料','materials')}${state.modified?button('查看上一个结果','old'):''}${['ready','updating'].includes(state.phase)?button('制作说明与文件','details'):''}<\/div>`);return}
 if(a==='old'){closeDialog();state.modified=false;phase('ready');toast('这里用同一素材演示查看原片。');return}
 if(a==='details'){openDialog('制作说明与文件','<p>正式版在这里提供字幕、来源说明、工程与检查结果，默认页面只突出下载视频。<\/p><p class="hint">本样稿没有执行真实质量检查，不显示“全部通过”。<\/p>',button('知道了','close','main-button'));return}
 if(a==='review'){openDialog('设计评审状态',`<p class="hint">以下切换器仅用于评审，不进入正式产品。<\/p><div class="review-controls">${phaseNames.map(p=>`<button data-fixture="${p}">${p}<\/button>`).join('')}${button('连接中断','demo-offline')}${button('恢复连接','demo-online')}${button('发送失败','demo-send-failure')}<\/div>`);return}
 if(a==='demo-offline'||a==='demo-online'){state.connection=a==='demo-offline'?'reconnecting':'online';renderConnection();if(state.connection==='online')drainQueue();closeDialog();return}
 if(a==='demo-send-failure'){closeDialog();setDraft('想在结尾放上我的店名。');showError('这条消息没发出去，内容还在。连接恢复后再发送。');return}
}
function loadFixture(p){clearTimeout(state.turnTimer);clearTimeout(state.previewTimer);clearTimeout(state.productionTimer);state.turnToken++;state.turnActive=false;state.phase=p;state.connection='online';state.pendingEdit='';state.pendingMajor=null;state.pendingStyle=null;state.queued=[];state.modified=p==='updating';state.idea='给山野咖啡做一支温暖的开业视频，让人想进店坐坐。';state.name=p==='start'?'':'山野咖啡';state.goal=p==='start'?'':'介绍新店，发到社交平台';state.readiness=p!=='start';state.files=p==='start'?[]:[{name:'山野咖啡-logo.png',size:348000}];state.messages=p==='start'?[]:[{id:'seed-1',role:'user',text:'给我的咖啡店做一支介绍视频，温暖一点。'},{id:'seed-2',role:'assistant',text:'好呀。这支视频最想让大家记住什么？店名、特色，或者一张照片都可以。'},{id:'seed-3',role:'user',text:'叫山野咖啡，新店开业。想让人觉得可以慢下来坐坐。',file:'山野咖啡-logo.png'},{id:'seed-4',role:'assistant',text:'记下了：山野咖啡，新店开业。\n我会用温暖的图形讲清晨的一杯咖啡，最后邀请大家来坐坐。',detail:'示例资料与对话，仅用于设计演示。'}];
 if(['preview','making','ready','updating','error','cancelled'].includes(p))state.messages.push({id:'seed-5',role:'assistant',text:p==='preview'?'先看看左边这段效果。\n不需要懂分镜，告诉我感觉对不对就好。':p==='making'?'就按这个方向制作。你可以继续补资料或聊新想法，当前制作不会被聊天打断。':p==='error'?'这次合成没完成。资料和预览都在，不必重新填写。':'视频示例准备好了。想调音乐、文字或画面，继续说就好。'});
 keepDraft();shell();if(p==='collect')add('assistant','有门店照片吗？有的话画面会更像自己的店；没有也可以先用插画。',{choices:[{text:'添加资料',action:'attach'},{text:'暂时没有',action:'no-material'}]});}
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();doAction(el.dataset.action,el);return}const ex=e.target.closest('[data-example]');if(ex){setDraft(ex.dataset.example);state.mobile='chat';updateMobile();byId('chat-input').focus();}});
dialog.addEventListener('click',e=>{const st=e.target.closest('[data-style]');if(st){state.pendingMajor='换成'+styleName(st.dataset.style);state.pendingStyle=st.dataset.style;closeDialog();if(state.phase==='start'||state.phase==='collect'){state.styleId=state.pendingStyle;state.pendingStyle=null;state.pendingMajor=null;toast('已选 '+styleName()+'，先继续聊内容。')}else {add('assistant',`你选了${styleName(state.pendingStyle)}。要先准备一段新预览吗？`);renderChat()}return}
 const opt=e.target.closest('[data-setting]');if(opt){const key=opt.dataset.setting;state.settings[key]=key==='duration'?Number(opt.dataset.value):opt.dataset.value;dialog.querySelectorAll(`[data-setting="${key}"]`).forEach(b=>b.setAttribute('aria-pressed',String(b===opt)));return}
 const fi=e.target.closest('[data-fixture]');if(fi){closeDialog();loadFixture(fi.dataset.fixture);return}const act=e.target.closest('[data-action]');if(act){e.preventDefault();doAction(act.dataset.action,act)}});
dialog.addEventListener('cancel',()=>{setTimeout(()=>returnFocus?.focus?.({preventScroll:true}),0)});
byId('file-picker').addEventListener('change',e=>{const files=Array.from(e.target.files);e.target.value='';if(state.files.length+files.length>10)return showError('最多添加10份资料，可以先删掉不需要的。');for(const f of files){if(f.size>20*1024*1024)return showError('这份资料超过20MB，请换一个较小的文件。');if(!/\.(png|jpe?g|webp|pdf|md|txt|mp3|wav|m4a)$/i.test(f.name))return showError('请添加图片、PDF、文字或音频资料。');}
 state.files.push(...files.map(f=>({name:f.name,size:f.size})));if(dialog.open)closeDialog();add('user','补充了一份资料。',{file:files.map(f=>f.name).join('、')});add('assistant','资料已经添加到这个样稿里。正式产品会先读取内容，再继续帮你完善，不需要你重新抄写一遍。',{detail:'此原型不上传文件、不识别内容。'});if(state.phase==='preview'){state.previewChanged=true;state.readiness=true;phase('collect')}renderComposerExtras();});
window.__VB_DESIGN__={go(p){if(phaseNames.includes(p))loadFixture(p)},getState(){return {...state}},setConnection(c){state.connection=c;renderConnection();if(c==='online')drainQueue()},addAssistant(t){add('assistant',t)},finish(){finishProduction()},stopReply(){stopTurn()},send(t){submit(t)}};
const initial=location.hash.slice(1);if(phaseNames.includes(initial)&&initial!=='start')loadFixture(initial);else shell();
</script></body></html>
