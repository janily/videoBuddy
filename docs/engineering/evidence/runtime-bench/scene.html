<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
function rnd(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
window.render=t=>{ctx.reset();const r=rnd(42);ctx.fillStyle='#f4ead8';ctx.fillRect(0,0,1920,1080);
for(let i=0;i<1500;i++){ctx.strokeStyle=`rgba(${120+r()*80|0},${80+r()*60|0},40,0.25)`;ctx.beginPath();const x=r()*1920,y=r()*1080;ctx.moveTo(x,y);ctx.lineTo(x+20*Math.sin(t+i),y+15);ctx.stroke()}
ctx.fillStyle='#c33';ctx.beginPath();ctx.arc(960+300*Math.sin(t),540,120,0,7);ctx.fill();ctx.font='80px "Noto Sans CJK SC"';ctx.fillStyle='#333';ctx.fillText('中秋团圆',760,200)};
window.READY=true;</script></body></html>
