<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画风选择原型</title>
<style>
:root{--canvas:#FAFBF8;--surface:#fff;--soft:#F0F3EC;--hover:#E8EDE3;--ink:#252C25;--secondary:#566151;--muted:#66705F;--line:#DFE5DA;--control:#87917E;--action:#2E402C;--accent:#49633F;--success:#396139;--success-bg:#EDF5EA;--warn:#785718;--warn-bg:#FAF3E3;--font:"Noto Sans CJK SC","Noto Sans SC",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--canvas);font:400 15px/1.8 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}h1,h2,h3,p{margin:0}ol,ul{margin:0;padding:0;list-style:none}
.topbar{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.6px}.brand i{width:28px;height:28px;border-radius:8px;background:var(--action);display:grid;place-items:center}.brand i:after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.brand small{font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:18px}
.top-actions{display:flex;gap:14px;align-items:center;font-size:14px}.top-actions .new{border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.shell{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 388px}
.work{overflow:auto;min-height:0;position:relative}
.inner{max-width:912px;margin:0 auto;padding:40px 48px 48px}
.chat{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.chat header{padding:24px 24px 0}.chat h2{font-size:16px;font-weight:650}.chat header p{font-size:12px;color:var(--muted)}
.msgs{flex:1;padding:18px 24px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.bubble{border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.75;max-width:92%}
.bubble.me{align-self:flex-end;background:var(--soft);border-color:transparent}
.chip-action{display:inline-flex;margin-top:8px;border:1px solid var(--control);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--secondary)}
.composer{margin:0 16px 16px;border:1px solid var(--control);border-radius:14px;padding:12px 14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;font-size:14px;color:var(--muted)}
.composer .row{display:flex;justify-content:space-between;align-items:center}.send{width:40px;height:40px;border-radius:10px;background:var(--action)}
/* welcome */
.eyebrow{font-size:13px;color:var(--muted)}.welcome h1{font-size:40px;line-height:1.4;letter-spacing:-1.2px;font-weight:650;margin-top:6px}
.intro{margin-top:14px;color:var(--secondary);font-size:16px}
.examples{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}.examples button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:14px;color:var(--secondary)}
.inspire{margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.sec-head h2{font-size:17px;font-weight:650}.sec-head p{font-size:13px;color:var(--muted)}
.link{font-size:14px;color:var(--accent);font-weight:550;white-space:nowrap;border-bottom:1px solid currentColor;line-height:1.3}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:16px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:border-color .14s,box-shadow .14s}
.tile .thumb{aspect-ratio:16/9;display:block;width:100%}
.tile .thumb svg{display:block;width:100%;height:100%}
.tile .body{padding:10px 12px 12px}
.tile strong{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:650;line-height:1.5}
.tile small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.6;color:var(--muted);margin-top:2px;min-height:38px}
.tile.compact small{-webkit-line-clamp:1;min-height:0}
.tile.hover{border-color:var(--control);box-shadow:0 6px 20px rgba(37,44,37,.08)}
.tile.hover .pick{opacity:1}
.pick{position:absolute;right:8px;top:8px;opacity:0;background:rgba(255,255,255,.94);color:var(--action);font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.tile.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile.selected .check{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.tile.selected .check:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.badge{font-size:11px;font-weight:550;border-radius:999px;padding:1px 8px;background:var(--success-bg);color:var(--success);line-height:1.6}
.reason{display:block;font-size:12.5px;line-height:1.65;color:var(--secondary);margin-top:4px}
/* canvas card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.card.current{border-color:var(--control)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}.card-head h2{font-size:16px;font-weight:650;display:flex;gap:10px;align-items:center}
.card-head h2 span{font-size:12px;color:var(--muted);font-weight:500}
.status{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted)}.status.need{background:var(--warn-bg);color:var(--warn)}.status.done{background:var(--success-bg);color:var(--success)}
.card .note{font-size:13px;color:var(--muted);margin-bottom:14px}
.card-foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.collapsed{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--secondary)}
/* library */
.lib-head{position:sticky;top:0;z-index:5;background:var(--canvas);padding:18px 48px 14px;border-bottom:1px solid transparent}
.lib-head.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 16px -14px rgba(37,44,37,.35)}
.lib-head .bar{max-width:816px;margin:0 auto}
.lib-top{display:flex;align-items:center;gap:14px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--secondary);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px 5px 9px}
.back:before{content:"";width:7px;height:7px;border-left:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);margin:0 2px 0 4px}
.lib-top h1{white-space:nowrap;font-size:20px;font-weight:650;letter-spacing:-.3px}.lib-top h1 span{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.search{flex:1;min-width:0;margin-left:8px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--control);border-radius:12px;padding:0 14px;height:46px}
.search svg{flex:none}.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent}.search input::placeholder{color:var(--muted)}
.search .count{font-size:12px;color:var(--muted);white-space:nowrap}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:13px;border-radius:999px;padding:2px 11px;border:1px solid var(--line);background:var(--surface);color:var(--secondary)}
.chips button[aria-pressed=true]{background:var(--action);border-color:var(--action);color:#fff}
.lib-body{max-width:912px;margin:0 auto;padding:8px 48px 48px}
.group{margin-top:22px}.group h2{font-size:15px;font-weight:650;margin-bottom:12px;display:flex;gap:8px;align-items:baseline}.group h2 span{font-size:12px;color:var(--muted);font-weight:400}
.empty{margin-top:40px;text-align:center;color:var(--secondary)}.empty h2{font-size:17px;font-weight:650;color:var(--ink)}.empty p{font-size:14px;margin-top:6px}
.empty .chips{justify-content:center;margin-top:16px}
.confirm{margin-top:14px;border:1px solid #E6D7B5;background:var(--warn-bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--warn)}
.confirm .btns{display:flex;gap:8px}.btn{border-radius:10px;padding:6px 14px;font-size:13px;font-weight:600}.btn.primary{background:var(--action);color:#fff}.btn.ghost{border:1px solid var(--control);color:var(--secondary);background:#fff}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--action);color:#fff;border-radius:999px;padding:8px 18px;font-size:13.5px;box-shadow:0 10px 30px rgba(37,44,37,.25);white-space:nowrap}
.toast b{font-weight:600;margin-left:10px;text-decoration:underline}
/* mobile */
.m .topbar{height:56px;padding:0 16px}.m .brand small{display:none}.m .top-actions .mine{display:none}
.m .shell{grid-template-columns:1fr;height:calc(100vh - 56px - 52px)}.m .chat{display:none}
.m .tabs{height:52px;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface);font-size:14px;text-align:center;align-items:center}
.m .tabs .on{color:var(--action);font-weight:650}
.m .lib-head{padding:12px 16px 10px}.m .lib-body{padding:4px 16px 32px}.m .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.m .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}.m .chips button{flex:none}
.m .tile .body{padding:8px 10px 10px}.m .tile small{font-size:11.5px}
.m .search{height:42px;flex-basis:100%;margin:10px 0 0}.m .lib-top{flex-wrap:wrap;gap:10px}
.m .pick{display:none}.tabs{display:none}.m .tabs{display:grid}
</style></head>
