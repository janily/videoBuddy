 </defs><rect x="0" y="0" width="640" height="360" fill="#090f1b" /><ellipse cx="436" cy="188" rx="185" ry="150" fill="url(#light)" /><rect x="540" y="49" width="10" height="237" fill="#89d5ef" filter="url(#glow)" opacity=".6"/><rect x="346" y="97" width="5" height="182" fill="#d2f4fc" filter="url(#glow)" opacity=".4"/><text x="37" y="66" font-size="27" fill="#d8f4fd" font-weight="600" >给生活留一杯时间</text><text x="37" y="92" font-size="10" fill="#d8f4fd" letter-spacing="3" opacity=".7">COFFEE BREAK</text><ellipse cx="440" cy="300" rx="112" ry="20" fill="#42748a" opacity=".25"/><g transform="translate(438 213) scale(1.02)" ><ellipse cx="0" cy="78" rx="98" ry="15" fill="#bee6ef" opacity=".14"/><path d="M64 -26 C126 -42 125 40 57 34" fill="none" stroke="#bee6ef" stroke-width="12.3" stroke-linecap="round"/><path d="M64 -26 C126 -42 125 40 57 34" fill="none" stroke="url(#glass)" stroke-width="5.3" stroke-linecap="round"/><path d="M-70 -43 L-57 43 Q-52 68 0 68 Q52 68 57 43 L70 -43Z" fill="url(#glass)" stroke="#bee6ef" stroke-width="1.3" /><ellipse cx="0" cy="-43" rx="70" ry="17" fill="url(#glass)" stroke="#bee6ef" stroke-width="1.3"/><ellipse cx="0" cy="-43" rx="56" ry="11" fill="#946e50" /><path d="M-28 -45Q0 -63 28 -43Q0 -25 -28 -45" fill="none" stroke="url(#glass)" stroke-width="3" /><g id="steam"><path d="M-28 -75 C-46 -91 -10 -103 -28 -122" fill="none" stroke="#bee6ef" stroke-width="3" stroke-linecap="round"/><path d="M0 -75 C-18 -91 18 -103 0 -122" fill="none" stroke="#bee6ef" stroke-width="3" stroke-linecap="round"/><path d="M28 -75 C10 -91 46 -103 28 -122" fill="none" stroke="#bee6ef" stroke-width="3" stroke-linecap="round"/></g></g><g transform="translate(438 213)" ><path d="M-56 -33L-44 44Q-42 56 -31 58" fill="none" stroke="#e6f9ff" stroke-width="4" opacity=".75"/><path d="M40 -34L33 52" fill="none" stroke="#8b83cc" stroke-width="2" /><path d="M-49 7Q0 21 50 7L44 44Q0 65 -42 42Z" fill="#b6885e" stroke="none" stroke-width="1" opacity=".16"/></g></svg><script>
